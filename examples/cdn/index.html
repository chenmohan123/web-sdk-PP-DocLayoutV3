<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PP-DocLayoutV3 CDN 示例</title>
    <style>
      body {
        max-width: 760px;
        margin: 40px auto;
        padding: 0 20px;
        color: #17202a;
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      button,
      input {
        font: inherit;
      }
      button {
        padding: 8px 14px;
      }
      progress {
        width: 100%;
        margin-top: 16px;
      }
      pre {
        min-height: 120px;
        overflow: auto;
        padding: 16px;
        background: #f4f6f7;
        border: 1px solid #d5d8dc;
      }
      .error {
        color: #b42318;
      }
    </style>
  </head>
  <body>
    <h1>PP-DocLayoutV3 CDN 示例</h1>
    <div class="controls">
      <input id="image" type="file" accept="image/png,image/jpeg,image/webp" />
      <button id="detect" type="button">检测单张图片</button>
      <button id="dispose" type="button">释放模型</button>
    </div>
    <p id="status" role="status">请选择图片</p>
    <progress id="progress" max="100" value="0"></progress>
    <pre id="output" aria-live="polite"></pre>

    <script src="https://cdn.jsdelivr.net/npm/web-sdk-pp-doclayoutv3@latest/dist/browser-global.js"></script>
    <script>
      const image = document.querySelector("#image");
      const status = document.querySelector("#status");
      const progress = document.querySelector("#progress");
      const output = document.querySelector("#output");
      let detector;

      const showError = (error) => {
        const structured = error instanceof window.PPDocLayout.DocLayoutError;
        output.className = "error";
        output.textContent = JSON.stringify(
          structured
            ? { code: error.code, message: error.message, details: error.details }
            : { message: String(error) },
          null,
          2
        );
      };

      document.querySelector("#detect").addEventListener("click", async () => {
        const file = image.files?.[0];
        if (!file) return;
        output.className = "";
        output.textContent = "";
        try {
          await detector?.dispose();
          detector = await window.PPDocLayout.createDocLayout({
            backend: "auto",
            precision: "auto",
            onProgress: (event) => {
              status.textContent = `${event.phase}: ${event.status}`;
              if (event.totalBytes)
                progress.value = ((event.loadedBytes || 0) / event.totalBytes) * 100;
            }
          });
          const result = await detector.detect(file, { threshold: 0.5 });
          progress.value = 100;
          status.textContent = `完成：${result.detections.length} 个版面区域`;
          output.textContent = JSON.stringify(result, null, 2);
        } catch (error) {
          status.textContent = "检测失败";
          showError(error);
        }
      });

      document.querySelector("#dispose").addEventListener("click", async () => {
        await detector?.dispose();
        detector = undefined;
        status.textContent = "模型已释放";
      });
      window.addEventListener("pagehide", () => void detector?.dispose());
    </script>
  </body>
</html>
