name: npm release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - name: Require the release tag to be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify tag, package, models, workspace, and packed package
        run: node scripts/verify-release.mjs --release "${GITHUB_REF_NAME}"
      - name: Publish with npm provenance
        working-directory: packages/sdk
        run: npm publish --access public --provenance
      - name: Record published integrity
        run: |
          echo '## npm integrity' >> "$GITHUB_STEP_SUMMARY"
          npm view web-sdk-pp-doclayoutv3@"${GITHUB_REF_NAME#v}" version dist.integrity --json | tee -a "$GITHUB_STEP_SUMMARY"
