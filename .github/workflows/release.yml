name: npm release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - name: Require the release tag to be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify tag, package, models, workspace, and packed package
        run: node scripts/verify-release.mjs --release "${GITHUB_REF_NAME}"
      - name: Publish with npm provenance
        working-directory: packages/sdk
        run: npm publish --access public --provenance
      - name: Record published integrity
        shell: bash
        timeout-minutes: 17
        run: |
          set -o pipefail
          package="web-sdk-pp-doclayoutv3@${GITHUB_REF_NAME#v}"
          for attempt in {1..21}; do
            if metadata="$(npm view "$package" version dist.integrity --json --registry=https://registry.npmjs.org --fetch-retries=0 --fetch-timeout=15000)"; then
              {
                echo '## npm integrity'
                echo "$metadata"
              } | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if (( attempt < 21 )); then
              echo "npm registry 暂未返回 $package 的完整性（第 $attempt/21 次）；30 秒后重试。" >&2
              sleep 30
            fi
          done
          {
            echo '## npm 发布后核验未完成'
            echo "npm publish 已成功返回，但经过 21 次查询仍无法读取 $package 的完整性。"
            echo '请单独核验 npm registry 和来源证明；不要重跑整个发布作业或重复发布。'
          } | tee -a "$GITHUB_STEP_SUMMARY" >&2
          exit 1
